<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The Linux image has no Windows fonts. Without these aliases LibreOffice
     replaces 宋体/楷体 with Noto Sans CJK, so the whole PDF looks like 黑体. -->
<fontconfig>
  <alias binding="same"><family>宋体</family><prefer><family>SimSun</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>SimSun</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>新宋体</family><prefer><family>NSimSun</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>NSimSun</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>黑体</family><prefer><family>SimHei</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>SimHei</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>楷体</family><prefer><family>KaiTi</family><family>AR PL UKai CN</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>KaiTi</family><family>AR PL UKai CN</family></prefer></alias>
  <alias binding="same"><family>仿宋</family><prefer><family>FangSong</family><family>AR PL UMing CN</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>FangSong</family><family>AR PL UMing CN</family></prefer></alias>
  <alias binding="same"><family>方正舒体</family><prefer><family>FZShuTi</family><family>AR PL UKai CN</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Times New Roman</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>FZShuTi</family><prefer><family>FZShuTi</family><family>AR PL UKai CN</family></prefer></alias>
</fontconfig>
