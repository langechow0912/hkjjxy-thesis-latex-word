<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毕业论文格式流水线</title>
<style>
  :root{
    --bg:#F7F7F5; --card:#FFFFFF; --line:#E4E4DF; --line2:#EFEFEB;
    --tx:#1F1F1D; --tx2:#6B6B66; --tx3:#9A9A94;
    --pri:#1F6F4E; --pri-soft:#E8F2ED; --warn:#B4531A; --warn-soft:#FBF0E6;
    --err:#A32D2D; --err-soft:#FCEBEB;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6}
  header{background:var(--card);border-bottom:1px solid var(--line);
    padding:14px 24px;display:flex;align-items:baseline;gap:12px}
  header h1{font-size:15px;font-weight:500;margin:0}
  header span{font-size:12px;color:var(--tx3)}
  main{max-width:1080px;margin:0 auto;padding:20px 24px 48px}
  .card{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:13px;font-weight:500;margin:0 0 14px;color:var(--tx2);
    display:flex;align-items:center;gap:8px}
  .num{width:18px;height:18px;border-radius:50%;background:var(--pri-soft);
    color:var(--pri);font-size:11px;display:grid;place-items:center;flex:none}
  label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
  select,input[type=text]{width:100%;padding:7px 10px;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--tx);font-size:13px;
    font-family:inherit}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:190px}
  .drop{border:1.5px dashed var(--line);border-radius:10px;padding:26px 16px;
    text-align:center;cursor:pointer;background:#FCFCFB;transition:.15s}
  .drop:hover{border-color:var(--pri);background:var(--pri-soft)}
  .drop.over{border-color:var(--pri);background:var(--pri-soft)}
  .drop b{font-weight:500}
  .drop small{display:block;color:var(--tx3);margin-top:4px;font-size:12px}
  textarea{width:100%;min-height:300px;padding:12px;border:1px solid var(--line);
    border-radius:8px;background:#FCFCFB;color:var(--tx);font-size:12.5px;
    line-height:1.65;font-family:"Cascadia Mono",Consolas,"Microsoft YaHei",monospace;
    resize:vertical}
  .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{padding:8px 18px;border-radius:8px;border:1px solid var(--pri);
    background:var(--pri);color:#fff;font-size:13px;font-family:inherit;
    cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#fff;color:var(--tx2);border-color:var(--line)}
  button.ghost:hover{border-color:var(--tx3);color:var(--tx)}
  #log{background:#1E1F1C;color:#D6D6CE;border-radius:8px;padding:12px 14px;
    font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;line-height:1.6;
    max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--tx2)}
  .stat b{font-weight:500;color:var(--tx)}
  .msg{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:12.5px;display:none}
  .msg.err{display:block;background:var(--err-soft);color:var(--err)}
  .msg.ok{display:block;background:var(--pri-soft);color:var(--pri)}
  .hint{font-size:12px;color:var(--tx3);margin-top:8px}
  .files{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .chip{padding:6px 14px;border:1px solid var(--line);border-radius:20px;
    background:#fff;font-size:12.5px;color:var(--tx);text-decoration:none}
  .chip:hover{border-color:var(--pri);color:var(--pri)}
</style>
</head>
<body>
<header>
  <h1>毕业论文格式流水线</h1>
  <span>LaTeX 格式包 + 可编辑 Word · 一条命令出双产物</span>
</header>

<main>
  <div class="card">
    <h2><span class="num">1</span>选择学校与稿件</h2>
    <div class="row">
      <div>
        <label>学校</label>
        <select id="school"></select>
      </div>
      <div>
        <label>论文名称（用作目录名）</label>
        <input type="text" id="name" placeholder="留空则用上传文件名">
      </div>
    </div>
    <div style="margin-top:14px">
      <div class="drop" id="drop">
        <b>点击或拖拽 Word 稿到这里</b>
        <small>支持 .docx（自动转 LaTeX 源码）</small>
      </div>
      <input type="file" id="file" accept=".docx" hidden>
      <div class="hint">已准备好 main.tex？点右下「我已有 tex」直接粘贴。</div>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">2</span>校对 LaTeX 源码</h2>
    <textarea id="tex" placeholder="上传 .docx 后自动生成；也可直接粘贴已有的 main.tex"></textarea>
    <div class="hint">自动转换靠编号识别标题，没有编号的标题识别不出来——这里就是让你补的地方。</div>
  </div>

  <div class="card">
    <h2><span class="num">3</span>生成与下载</h2>
    <div class="btns">
      <button id="go">生成 PDF + Word</button>
      <button class="ghost" id="onlypdf">只出 PDF</button>
      <button class="ghost" id="onlydocx">只出 Word</button>
      <span id="state" style="font-size:12px;color:var(--tx3)"></span>
    </div>
    <div class="msg" id="msg"></div>
    <div id="log" style="display:none"></div>
    <div class="files" id="files"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let curJob = null, timer = null;

async function loadSchools(){
  const r = await fetch('/api/schools').then(x=>x.json());
  const sel = $('school');
  sel.innerHTML = r.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}

function show(msg, kind){
  const m = $('msg');
  m.textContent = msg;
  m.className = 'msg ' + (kind||'ok');
}

async function upload(file){
  show('正在转换 ' + file.name + ' ...');
  $('go').disabled = true;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('school', $('school').value);
  try{
    const r = await fetch('/api/convert', {method:'POST', body:fd}).then(x=>x.json());
    if(r.error) throw new Error(r.error);
    $('tex').value = r.tex;
    if(!$('name').value) $('name').value = r.name;
    show(`转换完成：${r.stat.tables} 表 / ${r.stat.figures} 图 / ${r.stat.refs} 条参考文献`, 'ok');
    $('go').disabled = false;
  }catch(e){
    show('转换失败：' + e.message, 'err');
    $('go').disabled = false;
  }
}

async function build(pdf, docx){
  const tex = $('tex').value;
  if(!tex.trim()){ show('请先上传 Word 稿或粘贴 tex 内容', 'err'); return; }
  $('log').style.display = 'block';
  $('log').textContent = '';
  show('构建中…');
  $('go').disabled = true;
  $('onlypdf').disabled = true;
  $('onlydocx').disabled = true;
  const r = await fetch('/api/build', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({school:$('school').value, name:$('name').value,
                          tex:tex, pdf:pdf, docx:docx})
  }).then(x=>x.json());
  curJob = r.job;
  poll();
}

async function poll(){
  clearTimeout(timer);
  const j = await fetch('/api/job/' + curJob).then(x=>x.json());
  $('log').textContent = j.log.join('\n');
  $('log').scrollTop = $('log').scrollHeight;
  $('state').textContent = j.state;
  if(j.state === 'running'){ timer = setTimeout(poll, 700); return; }
  $('go').disabled = false;
  $('onlypdf').disabled = false;
  $('onlydocx').disabled = false;
  if(j.state === 'error'){ show('构建出错，看日志', 'err'); return; }
  show('构建完成', 'ok');
  const box = $('files'); box.innerHTML = '';
  for(const k of Object.keys(j.files)){
    const a = document.createElement('a');
    a.className = 'chip';
    a.href = `/api/download/${curJob}/${k}`;
    a.textContent = k === 'pdf' ? '下载 PDF' : '下载 Word';
    box.appendChild(a);
  }
}

const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
file.onchange = e => { if(e.target.files[0]) upload(e.target.files[0]); };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e=>{
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e=>{
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e=>{
  const f = e.dataTransfer.files[0]; if(f) upload(f);
});

$('go').onclick = () => build(true,true);
$('onlypdf').onclick = () => build(true,false);
$('onlydocx').onclick = () => build(false,true);

loadSchools();
</script>
</body>
</html>
