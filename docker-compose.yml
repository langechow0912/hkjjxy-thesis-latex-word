name: thesis-format

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: thesis-format:local
    restart: unless-stopped
    init: true
    environment:
      THESIS_ENV: production
      THESIS_ALLOWED_HOSTS: ${THESIS_ALLOWED_HOSTS:-${DOMAIN:?Set DOMAIN in .env to the public site hostname}}
      THESIS_AUTH_USER: ${THESIS_AUTH_USER:-}
      THESIS_AUTH_PASS_FILE: ${THESIS_AUTH_PASS_FILE:-}
      THESIS_REQUIRE_AUTH: ${THESIS_REQUIRE_AUTH:-false}
      AFFILIATE_ADMIN_USER: ${AFFILIATE_ADMIN_USER:-}
      AFFILIATE_ADMIN_PASS_FILE: ${AFFILIATE_ADMIN_PASS_FILE:-}
      AFFILIATE_PROOF_DIR: /data/affiliate-proofs
      THESIS_KEEP_JOBS: ${THESIS_KEEP_JOBS:-50}
      THESIS_MAX_JOBS: ${THESIS_MAX_JOBS:-2}
      THESIS_MAX_CLOUD_JOBS: ${THESIS_MAX_CLOUD_JOBS:-3}
      TMPDIR: /data/tmp
      DAYIPAPER_PAT_FILE: /run/secrets/dayipaper_pat
      TABWORD_API_KEY_FILE: /run/secrets/tabword_api_key
      TABWORD_BASE_URL: ${TABWORD_BASE_URL:-https://api.tabword.com}
      TABWORD_FORMAT_BASE_URL: ${TABWORD_FORMAT_BASE_URL:-https://apihub.ycjg.top}
      TABWORD_ENABLE_CALLS: ${TABWORD_ENABLE_CALLS:-false}
      TABWORD_ENABLE_DEVELOPMENT: ${TABWORD_ENABLE_DEVELOPMENT:-false}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-2021007108658866}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_MODE: ${ALIPAY_MODE:-production}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      THESIS_FORMAT_PRICE_CENTS: ${THESIS_FORMAT_PRICE_CENTS:-2999}
      ALIPAY_APP_PRIVATE_KEY_FILE: /run/secrets/alipay_app_private_key.pem
      ALIPAY_PUBLIC_KEY_FILE: /run/secrets/alipay_platform_public_key.pem
      ALIPAY_ORDER_DB: /data/alipay-orders.sqlite3
    expose:
      - "8000"
    volumes:
      - thesis_data:/data
      - thesis_samples:/app/samples
      - ./deploy/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/thesis:rw,nosuid,nodev,uid=10001,gid=10001,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; host=os.environ['THESIS_ALLOWED_HOSTS'].split(',')[0]; req=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Host':host}); urllib.request.urlopen(req, timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to the public site hostname}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  thesis_data:
  thesis_samples:
  caddy_data:
  caddy_config:
