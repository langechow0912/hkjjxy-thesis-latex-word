# 服务器部署（含 Caddy 自动 HTTPS）
#
# 用法：
#   cp .env.example .env && 编辑 .env 填域名
#   docker compose -f docker-compose.server.yml up -d --build
#
# 前置：域名已 A 记录解析到本机公网 IP，且 80 / 443 端口已放行（见 docs/deploy-oracle.md）

services:
  thesis:
    build: .
    image: thesis-format:latest
    container_name: thesis-format
    expose:
      - "8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      THESIS_XELATEX: xelatex
      THESIS_SOFFICE: soffice
      THESIS_TMP: /tmp/thesis
    volumes:
      # 论文与产物持久化到宿主机，重建容器不丢
      - ./samples:/app/samples
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: thesis-caddy
    ports:
      - "80:80"
      - "443:443"
      - "80:80/udp"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - thesis
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
